<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CashFlow</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div id="cabecalhoAno">
        <button id="btnAno"></button>
      </div>
      <div id="cabecalhoMes">
        <button id="btnMes"></button>
      </div>
    </header>
    <main>
      <div>
        <h2>Lançamento</h2>
        <form id="transacaoForm">
          <input type="text" id="descricao" placeholder="Descrição" required />
          <input
            type="text"
            id="valor"
            placeholder="R$ 0,00"
            oninput="mascaraMoeda(this)"
            required
          />
          <input type="date" id="data" />

          <select id="tipo">
            <option value="entrada">Entrada</option>
            <option value="saida">Saída</option>
          </select>

          <select id="categoria">
            <option value="Alimentação">Alimentação</option>
            <option value="Lazer">Lazer</option>
            <option value="Salario">Salário</option>
          </select>

          <button type="submit">Adicionar</button>
        </form>
        <input type="button" onclick="reset()" value="reset" />
      </div>

      <div>
        <div class="filtro">
          <h2>Entrada</h2>
          <h3 id="totalEntrada"></h3>
          <table>
            <thead>
              <tr>
                <th>Descrição</th>
                <th>Valor</th>
                <th>Data</th>
                <th>Tipo</th>
                <th>Categoria</th>
              </tr>
            </thead>
            <tbody id="tEntrada"></tbody>
          </table>
        </div>
        <div class="filtro">
          <h2>Saída</h2>
          <h3 id="totalSaida"></h3>
          <table>
            <thead>
              <tr>
                <th>Descrição</th>
                <th>Valor</th>
                <th>Data</th>
                <th>Tipo</th>
                <th>Categoria</th>
              </tr>
            </thead>
            <tbody id="tSaida"></tbody>
          </table>
        </div>
      </div>

      <div>
        <h2>Total</h2>
        <h3 id="totalLancamento"></h3>
        <table>
          <thead>
            <tr>
              <th>Descrição</th>
              <th>Valor</th>
              <th>Data</th>
              <th>Tipo</th>
              <th>Categoria</th>
            </tr>
          </thead>
          <tbody id="tLancamento"></tbody>
        </table>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
