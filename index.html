<!DOCTYPE html>
<html lang="PT-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cash Flow</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f4f4f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .card {
        background-color: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
        width: 300px;
      }

      h1 {
        color: #333;
        font-size: 24px;
        margin-bottom: 5px;
      }

      .balance {
        font-size: 36px;
        color: #6d80ec;
        font-weight: bold;
        margin-bottom: 20px;
      }

      .flow {
        display: grid;
        grid-template-columns: 1fr 1fr; /* Divide em duas colunas iguais */
        grid-template-areas:
          "titleIn titleOut"
          "valIn valOut";
        gap: 5px;
        background-color: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        border: 1px solid #eaeaea;
      }

      .flow h2 {
        font-size: 12px;
        color: #777;
        text-transform: uppercase;
        margin: 0;
        letter-spacing: 1px;
      }

      .flow h2:nth-of-type(1) {
        grid-area: titleIn;
      }
      .flow h2:nth-of-type(2) {
        grid-area: titleOut;
      }

      .inFlow {
        grid-area: valIn;
        font-size: 20px;
        color: #27ae60; /* Verde */
        font-weight: bold;
      }

      .outFlow {
        grid-area: valOut;
        font-size: 20px;
        color: #e74c3c; /* Vermelho */
        font-weight: bold;
      }

      input {
        width: 80%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
      }

      button {
        background-color: #2980b9;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        width: 100%;
        transition: background 0.3s;
      }

      button:hover {
        background-color: #1a5276;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Meu Saldo</h1>
      <div class="balance" id="valueBalance">R$ 0,00</div>
      <div class="flow">
        <h2>Entrada</h2>
        <div class="inFlow" id="valueInFlow">R$ 0,00</div>
        <input type="number" id="inputValue" value="0" />

        <h2>Saida</h2>
        <div class="outFlow" id="valueOutFlow">R$ 0,00</div>
        <input type="number" id="outputValue" value="0" />
      </div>

      <button onclick="calculate()">Calcular</button>
    </div>

    <script>
      let currentBalance = 0;
      let inputFlow = 0;
      let outputFlow = 0;

      function calculate() {
        const input = document.getElementById("inputValue");
        const inputValue = parseFloat(input.value);

        const output = document.getElementById("outputValue");
        const outputValue = parseFloat(output.value);

        if (
          isNaN(inputValue) ||
          inputValue < 0 ||
          isNaN(outputValue) ||
          outputValue < 0
        ) {
          alert("Por favor, digite um valor válido!");
          return;
        }

        inputFlow = inputFlow + inputValue;
        outputFlow = outputFlow + outputValue;

        currentBalance = inputFlow - outputFlow;

        document.getElementById("valueInFlow").innerText =
          inputFlow.toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL",
          });

        document.getElementById("valueOutFlow").innerText =
          outputFlow.toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL",
          });

        document.getElementById("valueBalance").innerText =
          currentBalance.toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL",
          });

        input.value = 0;
        output.value = 0;
      }
    </script>
  </body>
</html>
