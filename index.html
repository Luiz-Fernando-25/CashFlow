<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="img/ico_t.ico" type="image/x-icon" />
    <title>CashFlow</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <div class="head-logo">
        <img src="img/logo.jpg" alt="" />
      </div>
      <div class="head-filtro">
        <div id="cabecalhoAno">
          <button id="btnAno"></button>
        </div>
        <div id="cabecalhoMes">
          <button id="btnMes"></button>
        </div>
      </div>
      <div class="head-extra">
        <input type="button" onclick="reset()" value="reset" />
      </div>
    </header>
    <main>
      <div class="card">
        <h2>Lançamento</h2>
        <form id="transacaoForm">
          <div>
            <label for="descricao">Descrição</label>
            <textarea
              name="descricao"
              id="descricao"
              placeholder="Descrição"
              required
            ></textarea>
          </div>
          <div class="valor">
            <span>R$:</span>
            <input
              type="text"
              id="valor"
              placeholder="0,00"
              oninput="mascaraMoeda(this)"
              required
            />
          </div>
          <div>
            <label for="data">Data</label>
            <input type="date" id="data" />
          </div>

          <select id="tipo">
            <option value="entrada">Entrada</option>
            <option value="saida">Saída</option>
          </select>

          <select id="categoria">
            <option value="Alimentação">Alimentação</option>
            <option value="Lazer">Lazer</option>
            <option value="Salario">Salário</option>
          </select>

          <button type="submit">Adicionar</button>
        </form>
      </div>

      <div class="card">
        <div class="filtro">
          <div class="valor-total">
            <h2>Entrada</h2>
            <h2 id="totalEntrada"></h2>
          </div>
          <ul id="tEntrada">
            <li><span>Descrição</span><span>Valor</span></li>
          </ul>
        </div>
        <div class="filtro">
          <div class="valor-total">
            <h2>Saída</h2>
            <h2 id="totalSaida"></h2>
          </div>
          <ul id="tSaida">
            <li><span>Descrição</span><span>Valor</span></li>
          </ul>
        </div>
      </div>

      <div class="card">
        <div class="valor-total">
          <h2>Total</h2>
          <h2 id="totalLancamento"></h2>
        </div>
        <ul id="tLancamento">
          <li><span>Descrição</span><span>Valor</span></li>
        </ul>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
