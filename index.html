<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finances</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div>
        <h2>Entrada</h2>
        <input type="number" class="numero" id="entrada" />
        <input type="button" onclick="addEntrada()" value="submit" />
        <h2 id="totalEntrada"></h2>
        <table>
          <tbody id="tEntrada"></tbody>
        </table>
      </div>
      <div>
        <h2>Saida</h2>
        <input type="number" class="numero" id="saida" />
        <input type="button" onclick="addSaida()" value="submit" />
        <h2 id="totalSaida"></h2>
        <table>
          <tbody id="tSaida"></tbody>
        </table>
      </div>
      <div>
        <h2>Total</h2>
        <input type="button" onclick="reset()" value="reset" />
        <h2 id="totalLancamento"></h2>
        <table>
          <tbody id="tLancamentos"></tbody>
        </table>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
